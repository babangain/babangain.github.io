title: Baban Gain
email: gainbaban@gmail.com
description: >-
  Baban Gain is a doctoral researcher at IIT Patna working on machine
  translation, multilingual NLP, and language technologies for low-resource languages.
baseurl: ""
url: "https://babangain.github.io"
github_username: babangain

theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

whitelist:
  - jekyll-feed
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Baban Gain

exclude:
  - scripts
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md
